<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SlotDesk Chrome promotional artwork</title>
  <link rel="stylesheet" href="../../../extension/fonts/fonts.css">
  <style>
    :root{--lime:#D8E84A;--ink:#15160A;--paper:#FAF9EF}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--lime);color:var(--ink)}
    body{font-family:'DM Sans',sans-serif;font-weight:400;font-synthesis:none}
    .tile{position:relative;overflow:hidden;background:var(--lime)}
    .wordmark{display:inline-flex;align-items:baseline;white-space:nowrap;font-family:'VT323',monospace;font-weight:400;line-height:1.1;letter-spacing:.01em}
    .bracket{opacity:.55}
    h1,p{margin:0;font-weight:400}
    .small{width:440px;height:280px;padding:29px 32px}
    .small .wordmark{font-size:52px}
    .small h1{margin-top:29px;font-size:34px;line-height:1.08;letter-spacing:-.035em}
    .small .category{position:absolute;left:34px;bottom:26px;font-size:12px;letter-spacing:.12em}
    .small .accent{position:absolute;right:34px;bottom:29px;width:45px;height:11px;border:1px solid var(--ink);border-left-width:16px}
    .marquee{width:1400px;height:560px;padding:52px 84px}
    .marquee .wordmark{font-size:94px}
    .marquee h1{margin-top:33px;font-size:62px;line-height:1.05;letter-spacing:-.04em}
    .marquee .support{margin-top:28px;font-size:20px;letter-spacing:-.015em}
    .marquee .website{position:absolute;left:87px;bottom:43px;font-size:15px;letter-spacing:.01em}
    .timezone-card{position:absolute;right:82px;top:89px;width:350px;height:382px;padding:25px 27px;background:var(--paper);border:1px solid rgba(21,22,10,.7);border-radius:4px;box-shadow:10px 10px 0 rgba(21,22,10,.1);transform:rotate(2deg)}
    .card-heading{display:flex;align-items:center;gap:11px;padding-bottom:20px;font-size:12px;letter-spacing:.105em}
    .calendar-icon{width:23px;height:23px;flex:none}
    .time-row{display:flex;align-items:center;justify-content:space-between;height:86px;border-top:1px solid rgba(21,22,10,.18)}
    .city{font-size:18px;letter-spacing:-.025em}
    .time{font-size:37px;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
    .card-footer{border-top:1px solid rgba(21,22,10,.18);padding-top:18px;font-size:12px;letter-spacing:.025em;color:#62653D}
    body[data-tile="small"] .marquee,body[data-tile="marquee"] .small{display:none}
  </style>
</head>
<body data-tile="small">
  <main class="tile small" aria-label="SlotDesk small promotional tile">
    <div class="wordmark" aria-label="Slot Desk"><span class="bracket">[</span><span>SLOT DESK</span><span class="bracket">]</span></div>
    <h1>Make room<br>for what matters.</h1>
    <p class="category">MEETING WORKSPACE</p><span class="accent" aria-hidden="true"></span>
  </main>
  <main class="tile marquee" aria-label="SlotDesk marquee promotional tile">
    <div class="wordmark" aria-label="Slot Desk"><span class="bracket">[</span><span>SLOT DESK</span><span class="bracket">]</span></div>
    <h1>Make room<br>for what matters.</h1>
    <p class="support">Meetings across calendars and timezones.</p>
    <p class="website">buildwithspeedy.com</p>
    <div class="timezone-card" aria-label="Illustration of one meeting across three time zones">
      <div class="card-heading"><svg class="calendar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M7.5 2.5v5M16.5 2.5v5M3.5 10h17M8 13.5h3M8 17h3M14 13.5h2.5"/></svg>ONE MEETING. THREE CITIES.</div>
      <div class="time-row"><span class="city">Jerusalem</span><span class="time">16:00</span></div>
      <div class="time-row"><span class="city">New York</span><span class="time">09:00</span></div>
      <div class="time-row"><span class="city">London</span><span class="time">14:00</span></div>
      <p class="card-footer">Everyone’s local time.</p>
    </div>
  </main>
  <script>document.body.dataset.tile=new URLSearchParams(location.search).get('tile')==='marquee'?'marquee':'small';</script>
</body>
</html>
